server:
  port: 8081
spring:
  config:
    import: optional:file:.env[.properties],optional:file:.env.cloud[.properties],optional:file:hm-dianping/.env[.properties]
  application:
    name: hmdp
  main:
    banner-mode: console
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: ${HMDP_DATASOURCE_URL:jdbc:mysql://localhost:3306/hmdp?useSSL=false&serverTimezone=UTC}
    username: ${HMDP_DATASOURCE_USERNAME:hmdp_user}
    password: ${HMDP_DATASOURCE_PASSWORD:change-me}
  redis:
    host: ${HMDP_REDIS_HOST:localhost}
    port: ${HMDP_REDIS_PORT:6379}
    password: ${HMDP_REDIS_PASSWORD:change-me}
    lettuce:
      pool:
        # 秒杀限流会让每个请求先访问 Redis。压测时提高连接池容量，减少应用侧等待连接的排队。
        max-active: 50
        max-idle: 20
        min-idle: 5
        time-between-eviction-runs: 10s

  rabbitmq:
    host: ${HMDP_RABBITMQ_HOST:localhost}
    port: ${HMDP_RABBITMQ_PORT:5672}
    username: ${HMDP_RABBITMQ_USERNAME:hmdp}
    password: ${HMDP_RABBITMQ_PASSWORD:hmdp_mq_2026}
    virtual-host: ${HMDP_RABBITMQ_VIRTUAL_HOST:/hmdp}

    publisher-confirm-type: correlated
    publisher-returns: true

    template:
      mandatory: true

    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 20
        concurrency: 2
        max-concurrency: 8
        default-requeue-rejected: false
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
  global-config:
    banner: true
logging:
  level:
    root: info
    com.hmdp: debug

hmdp:
  instance-id: app-1
  cache:
    shop:
      # 压测对比时可改为 false，关闭 Caffeine 本地缓存，只走 Redis + MySQL。
      local-enabled: true
  id-generator:
    # 同一数据中心内，每个应用实例必须使用不同的 worker-id。
    worker-id: 1
    # 不同机房或逻辑部署区域使用不同的 datacenter-id。
    datacenter-id: 1
  rate-limit:
    enabled: true
    seckill:
      max-count: 300
      window-seconds: 1
  order-task:
    core-pool-size: 4
    maximum-pool-size: 8
    queue-capacity: 200
    keep-alive-seconds: 60
    monitor-interval-ms: 30000
  seckill:
    # RabbitMQ 异步下单对比压测开关：
    # true：Redis 预扣后发送 RabbitMQ，接口立即返回；
    # false：Redis 预扣后在接口线程同步写 MySQL，再返回。
    async-enabled: true
  redisson:
    enabled: false
    node1-address: ${HMDP_REDISSON_NODE1_ADDRESS:redis://localhost:6379}
    node2-address: ${HMDP_REDISSON_NODE2_ADDRESS:redis://localhost:6381}
    node3-address: ${HMDP_REDISSON_NODE3_ADDRESS:redis://localhost:6382}
    password: ${HMDP_REDISSON_PASSWORD:change-me}
