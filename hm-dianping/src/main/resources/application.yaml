server:
  port: 8081
spring:
  config:
    import: optional:file:.env[.properties],optional:file:.env.cloud[.properties],optional:file:hm-dianping/.env[.properties]
  application:
    name: hmdp
  main:
    banner-mode: console
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${HMDP_DATASOURCE_URL:jdbc:mysql://localhost:3306/hmdp?useSSL=false&serverTimezone=UTC}
    username: ${HMDP_DATASOURCE_USERNAME:hmdp_user}
    password: ${HMDP_DATASOURCE_PASSWORD:change-me}
  redis:
    host: ${HMDP_REDIS_HOST:localhost}
    port: ${HMDP_REDIS_PORT:6379}
    password: ${HMDP_REDIS_PASSWORD:change-me}
    lettuce:
      pool:
        # 秒杀限流会让每个请求先访问 Redis。压测时提高连接池容量，减少应用侧等待连接的排队。
        max-active: 50
        max-idle: 20
        min-idle: 5
        time-between-eviction-runs: 10s

  rabbitmq:
    host: ${HMDP_RABBITMQ_HOST:localhost}
    port: ${HMDP_RABBITMQ_PORT:5672}
    username: ${HMDP_RABBITMQ_USERNAME:hmdp}
    password: ${HMDP_RABBITMQ_PASSWORD:change-me}
    virtual-host: ${HMDP_RABBITMQ_VIRTUAL_HOST:/hmdp}

    publisher-confirm-type: correlated
    publisher-returns: true

    template:
      mandatory: true

    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 20
        concurrency: 2
        max-concurrency: 8
        default-requeue-rejected: false
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
  global-config:
    banner: true
logging:
  level:
    root: info
    com.hmdp: debug
    com.hmdp.mapper.CacheInvalidationOutboxMapper: info

hmdp:
  sms:
    # mock: local; aliyun-pnvs: personal SMS verification; aliyun: ordinary enterprise SMS.
    provider: ${HMDP_SMS_PROVIDER:mock}
    send-interval-seconds: ${HMDP_SMS_SEND_INTERVAL_SECONDS:60}
    max-sends-per-day: ${HMDP_SMS_MAX_SENDS_PER_DAY:10}
    ip-max-count: ${HMDP_SMS_IP_MAX_COUNT:10}
    aliyun:
      access-key-id: ${ALIBABA_CLOUD_ACCESS_KEY_ID:}
      access-key-secret: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:}
      sign-name: ${HMDP_SMS_ALIYUN_SIGN_NAME:}
      template-code: ${HMDP_SMS_ALIYUN_TEMPLATE_CODE:}
      code-param-name: ${HMDP_SMS_ALIYUN_CODE_PARAM_NAME:code}
      connect-timeout-ms: ${HMDP_SMS_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${HMDP_SMS_READ_TIMEOUT_MS:5000}
    pnvs:
      access-key-id: ${ALIBABA_CLOUD_ACCESS_KEY_ID:}
      access-key-secret: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:}
      sign-name: ${HMDP_SMS_PNVS_SIGN_NAME:}
      template-code: ${HMDP_SMS_PNVS_TEMPLATE_CODE:}
      code-param-name: ${HMDP_SMS_PNVS_CODE_PARAM_NAME:code}
      minutes-param-name: ${HMDP_SMS_PNVS_MINUTES_PARAM_NAME:min}
      connect-timeout-ms: ${HMDP_SMS_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${HMDP_SMS_READ_TIMEOUT_MS:5000}
  instance-id: app-1
  cache:
    shop:
      # 压测对比时可改为 false，关闭 Caffeine 本地缓存，只走 Redis + MySQL。
      local-enabled: true
    outbox:
      # 商户缓存失效Outbox扫描、租约、重试和延迟双删参数。
      scan-interval-ms: 1000
      batch-size: 50
      lease-seconds: 30
      max-retries: 8
      max-backoff-seconds: 60
      double-delete-delay-ms: 1000
      confirm-timeout-ms: 5000
  id-generator:
    # 同一数据中心内，每个应用实例必须使用不同的 worker-id。
    worker-id: 1
    # 不同机房或逻辑部署区域使用不同的 datacenter-id。
    datacenter-id: 1
  rate-limit:
    enabled: true
    seckill:
      max-count: 300
      window-seconds: 1
  order-task:
    core-pool-size: 4
    maximum-pool-size: 8
    queue-capacity: 200
    keep-alive-seconds: 60
    monitor-interval-ms: 30000
  seckill:
    # RabbitMQ 异步下单对比压测开关：
    # true：Redis 预扣后发送 RabbitMQ，接口立即返回；
    # false：Redis 预扣后在接口线程同步写 MySQL，再返回。
    async-enabled: true
  redisson:
    enabled: false
    node1-address: ${HMDP_REDISSON_NODE1_ADDRESS:redis://localhost:6379}
    node2-address: ${HMDP_REDISSON_NODE2_ADDRESS:redis://localhost:6381}
    node3-address: ${HMDP_REDISSON_NODE3_ADDRESS:redis://localhost:6382}
    password: ${HMDP_REDISSON_PASSWORD:change-me}
