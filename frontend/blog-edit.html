<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>发布笔记 - 乐享生活</title><link rel="stylesheet" href="/css/element.css">
<link rel="stylesheet" href="/css/main.css?v=20261029-repair1"><link rel="stylesheet" href="/css/app-fixes.css?v=20261029-repair1"></head>
<body>
<div id="app" class="editor-page"><header class="page-header"><button @click="goBack">取消</button><h1>发布笔记</h1><button class="primary-button" @click="submitBlog" :disabled="uploading||publishing">{{publishing?'发布中…':'发布'}}</button></header>
  <main class="note-editor"><div class="editor-photos"><input type="file" accept="image/jpeg,image/png,image/gif,image/webp" multiple @change="fileSelected" ref="fileInput" hidden>
    <div v-for="(src,i) in fileList" :key="src" class="editor-photo"><img :src="src" @error="imageError" :alt="'已上传图片'+(i+1)"><button @click="deletePic(i)" :disabled="uploading||publishing" aria-label="删除图片">×</button></div>
    <button class="upload-photo" v-if="fileList.length<9" @click="$refs.fileInput.click()" :disabled="uploading||publishing"><i class="el-icon-camera"></i><span>{{uploading?'上传中…':'上传照片'}}</span></button></div>
    <p class="muted">最多9张，每张不超过5MB，支持 JPG、PNG、GIF、WebP</p><input class="note-title-input" v-model="title" maxlength="255" placeholder="填写笔记标题"><textarea class="note-content-input" v-model="content" maxlength="2048" placeholder="分享你的探店体验…"></textarea><p class="text-count">{{content.length}} / 2048</p>
    <button class="shop-picker" @click="showDialog=true"><span>关联商户（可选）</span><span>{{selectedShop.name || '去选择'}} <i class="el-icon-arrow-right"></i></span></button>
  </main><el-dialog title="选择关联商户" :visible.sync="showDialog" width="90%"><form class="shop-search" @submit.prevent="queryShops"><el-input v-model="shopName" maxlength="100" placeholder="搜索商户名称、地点" clearable></el-input><button class="primary-button" type="submit">搜索</button></form><div class="picker-results"><button class="picker-option" v-for="s in shops" :key="s.id" @click="selectShop(s)"><strong>{{s.name}}</strong><small>{{s.area}} {{s.address}}</small></button><p v-if="!shops.length">暂无相关商户</p></div></el-dialog>
</div><script src="/js/vue.js"></script><script src="/js/axios.min.js"></script><script src="/js/element.js"></script>
<script src="/js/common.js?v=20261029-repair1"></script><script src="/js/footer.js?v=20261029-discovery2"></script><script>
const app=new Vue({el:'#app',data:{fileList:[],title:'',content:'',uploading:false,publishing:false,showDialog:false,shops:[],shopName:'',selectedShop:{}},created(){if(!sessionStorage.getItem('token')){util.toLogin();return;}axios.get('/user/me').catch(e=>this.$message.error(e));this.queryShops();},methods:{
  queryShops(){axios.get('/shop/of/name',{params:{name:this.shopName.trim()}}).then(({data})=>this.shops=data||[]).catch(e=>this.$message.error(e));},selectShop(s){this.selectedShop=s;this.showDialog=false;},
  async fileSelected(e){const files=Array.from(e.target.files||[]);e.target.value='';if(!files.length||this.uploading)return;if(this.fileList.length+files.length>9)return this.$message.warning('最多上传9张图片');if(files.some(f=>!/^image\/(jpeg|png|gif|webp)$/i.test(f.type)))return this.$message.warning('请选择 JPG、PNG、GIF 或 WebP 图片');if(files.some(f=>f.size>5*1024*1024))return this.$message.warning('每张图片不能超过5MB');this.uploading=true;try{for(const file of files){const body=new FormData();body.append('file',file);const {data}=await axios.post('/upload/blog',body,{timeout:30000});const src=util.imageUrl(data);if(!src)throw '上传结果无效，请重试';this.fileList.push(src);}}catch(error){this.$message.error(error);}finally{this.uploading=false;}},
  deletePic(i){if(this.uploading||this.publishing)return;const src=this.fileList[i];axios.get('/upload/blog/delete',{params:{name:src}}).then(()=>this.fileList.splice(this.fileList.indexOf(src),1)).catch(e=>this.$message.error(e));},
  submitBlog(){if(this.uploading||this.publishing)return;if(!this.title.trim())return this.$message.warning('请填写笔记标题');if(!this.content.trim()&&!this.fileList.length)return this.$message.warning('请填写正文或上传图片');this.publishing=true;axios.post('/blog',{title:this.title.trim(),content:this.content.trim(),images:this.fileList.join(','),shopId:this.selectedShop.id||0}).then(()=>location.href='/info.html').catch(e=>this.$message.error(e)).finally(()=>this.publishing=false);},goBack(){history.length>1?history.back():location.href='/info.html';}
}});
</script></body></html>
