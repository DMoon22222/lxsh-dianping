<!DOCTYPE html>
<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>乐享生活</title>
  <!-- 引入样式 -->
  <link rel="stylesheet" href="./css/element.css">
  <link href="./css/main.css?v=20260821-blue-profile" rel="stylesheet">
  <link href="./css/info.css?v=20260821-blue-profile" rel="stylesheet">

  <style type="text/css">
      .el-tabs--bottom .el-tabs__item.is-bottom:nth-child(2), .el-tabs--bottom .el-tabs__item.is-top:nth-child(2), .el-tabs--top .el-tabs__item.is-bottom:nth-child(2), .el-tabs--top .el-tabs__item.is-top:nth-child(2) {
          padding-left: 15px;
      }

      .el-tabs, .el-tab-pane {
          height: 100%;
      }

      .el-tabs__header {
          height: 10%;
      }

      .el-tabs__content {
          height: 90%;
      }
  </style>

<link rel="stylesheet" href="/css/app-fixes.css?v=20261029-repair1">
</head>

<body>
<div id="app">
  <div class="header">
    <div class="header-back-btn" @click="goBack"><i class="el-icon-arrow-left"></i></div>
    <div class="header-title">个人主页&nbsp;&nbsp;&nbsp;</div>
  </div>
  <div class="basic">
    <div class="basic-icon">
      <img @error="imageError" :src="imageUrl(user.icon) || '/imgs/icons/default-icon.png'" alt="">
    </div>
    <div class="basic-info">
      <div class="name">{{user.nickName}}</div>
      <span>{{ info.city || '广州' }}</span>
      <div class="edit-btn" @click="toEdit">
        编辑资料
      </div>
    </div>
    <div class="logout-btn" @click="logout">
      退出登录
    </div>
  </div>
  <div class="introduce">
    <span v-if="info.introduce">{{info.introduce}}</span>
    <span v-else>添加个人简介，让大家更好的认识你 <i class="el-icon-edit"></i></span>
  </div>
  <div class="content">
    <el-tabs v-model="activeName" @tab-click="handleClick">
      <el-tab-pane label="笔记" name="1">
        <div v-for="b in blogs" :key="b.id" class="blog-item" role="link" tabindex="0" @click="toBlogDetail(b)" @keydown.enter="toBlogDetail(b)">
          <div class="blog-img"><img @error="imageError" :src="firstImage(b.images)" alt=""></div>
          <div class="blog-info">
            <div class="blog-title">{{b.title}}</div>
            <div class="note-stats"><i class="el-icon-thumb"></i> {{b.liked || 0}}</div>
            
          </div>
        </div>
        <p class="list-status" v-if="!blogs.length && !notesLoading">还没有发布笔记</p>
        <button class="load-more" v-if="notesMore" :disabled="notesLoading" @click="queryBlogs">{{notesLoading?'加载中…':'加载更多笔记'}}</button>
      </el-tab-pane>
      <el-tab-pane label="评价" name="2" disabled></el-tab-pane>
      <el-tab-pane :label="'粉丝('+(info.fans || 0)+')'" name="3" disabled></el-tab-pane>
      <el-tab-pane label="关注动态" name="4">
        <div class="blog-list" @scroll="onScroll">
          <div class="blog-box" v-for="b in blogs2" :key="b.id">
            <div class="blog-img2" @click="toBlogDetail(b)"><img @error="imageError" :src="firstImage(b.images)" alt=""></div>
            <div class="blog-title">{{b.title}}</div>
            <div class="blog-foot">
              <div class="blog-user-icon"><img @error="imageError" :src="imageUrl(b.icon) || '/imgs/icons/default-icon.png'" alt=""></div>
              <div class="blog-user-name">{{b.name}}</div>
              <div class="blog-liked" @click="addLike(b)">
                <svg t="1646634642977" class="icon" viewBox="0 0 1024 1024" version="1.1"
                     xmlns="http://www.w3.org/2000/svg" p-id="2187" width="14" height="14">
                  <path
                      d="M160 944c0 8.8-7.2 16-16 16h-32c-26.5 0-48-21.5-48-48V528c0-26.5 21.5-48 48-48h32c8.8 0 16 7.2 16 16v448zM96 416c-53 0-96 43-96 96v416c0 53 43 96 96 96h96c17.7 0 32-14.3 32-32V448c0-17.7-14.3-32-32-32H96zM505.6 64c16.2 0 26.4 8.7 31 13.9 4.6 5.2 12.1 16.3 10.3 32.4l-23.5 203.4c-4.9 42.2 8.6 84.6 36.8 116.4 28.3 31.7 68.9 49.9 111.4 49.9h271.2c6.6 0 10.8 3.3 13.2 6.1s5 7.5 4 14l-48 303.4c-6.9 43.6-29.1 83.4-62.7 112C815.8 944.2 773 960 728.9 960h-317c-33.1 0-59.9-26.8-59.9-59.9v-455c0-6.1 1.7-12 5-17.1 69.5-109 106.4-234.2 107-364h41.6z m0-64h-44.9C427.2 0 400 27.2 400 60.7c0 127.1-39.1 251.2-112 355.3v484.1c0 68.4 55.5 123.9 123.9 123.9h317c122.7 0 227.2-89.3 246.3-210.5l47.9-303.4c7.8-49.4-30.4-94.1-80.4-94.1H671.6c-50.9 0-90.5-44.4-84.6-95l23.5-203.4C617.7 55 568.7 0 505.6 0z"
                      p-id="2188" :fill="b.isLike ? '#1677ff' : '#82848a'"></path>
                </svg>
                {{b.liked}}
              </div>
            </div>
          </div>
        </div>
      </el-tab-pane>
    </el-tabs>
  </div>
  <foot-bar :active-btn="4"></foot-bar>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<!-- 引入组件库 -->
<script src="./js/element.js"></script>
<script src="./js/common.js?v=20261029-repair1"></script>
<script src="./js/footer.js?v=20261029-discovery2"></script>
<script>
  const app = new Vue({
    el: "#app",
    data: {
      user: {},
      util,
      notesLoading: false,
      notesMore: true,
      notesPage: 1,
      activeName: "1",
      info: {},
      blogs: [],
      blogs2: [], // 关注的人的播客
      params: {
        minTime: 0, // 上一次拉取到的时间戳
        offset: 0, // 偏移量
      },
      count: 5,
      followLoading: false,
      followMore: true,
      isReachBottom: false,
    },
    created() {
      this.queryUser();
    },
    methods: {
      load() {
        this.count += 2;
      },
      queryBlogs() {
        if (this.notesLoading || !this.notesMore) return;
        this.notesLoading = true;
        axios.get('/blog/of/me', {params:{current:this.notesPage}}).then(({data}) => {
          const rows = data || []; this.blogs = this.blogs.concat(rows); this.notesPage++; this.notesMore = rows.length === 10;
        }).catch(e => this.$message.error(e)).finally(() => this.notesLoading=false);
      },
      queryBlogsOfFollow(clear) {
        if (this.followLoading || (!clear && !this.followMore)) return;
        if (clear) { this.params={minTime:Date.now()+1,offset:0}; this.blogs2=[]; this.followMore=true; }
        this.followLoading=true;
        const previous=this.params;
        axios.get('/blog/of/follow',{params:{lastId:previous.minTime,offset:previous.offset}}).then(({data})=>{
          const rows=data && data.list || [];
          this.followMore=rows.length===2;
          const ids=new Set(this.blogs2.map(b=>String(b.id)));
          this.blogs2=this.blogs2.concat(rows.filter(b=>!ids.has(String(b.id))));
          if(data && rows.length)this.params={minTime:data.minTime,offset:data.minTime===previous.minTime?previous.offset+data.offset:data.offset};
        }).catch(e=>this.$message.error(e)).finally(()=>this.followLoading=false);
      },
      queryUser() {
        // 查询用户信息
        axios.get("/user/me")
          .then(({data}) => {
            // 保存用户
            this.user = data;
            // 查询用户详情
            this.queryUserInfo();
            // 查询用户笔记
            this.queryBlogs();
          })
          .catch(err => {
            location.href = "login.html"
          })
      },
      goBack() {
        history.back();
      },
      queryUserInfo() {
        axios.get("/user/info/" + this.user.id)
          .then(({data}) => {
            if (!data) {
              return
            }
            // 保存用户详情
            this.info = data;
            // 保存到本地
            sessionStorage.setItem("userInfo", JSON.stringify(data))
          })
          .catch(err => {
            this.$message.error(err);
          })
      },
      toEdit() {
        location.href = 'info-edit.html'
      },
      logout() {
        const clearAndGoLogin = () => {
          sessionStorage.removeItem("token")
          sessionStorage.removeItem("userInfo")
          location.href = "/login.html"
        }
        axios.post("/user/logout")
          .then(clearAndGoLogin)
          .catch(() => {
            clearAndGoLogin()
          })
      },
      handleClick(r) {
        if (r.name === '4') {
          this.queryBlogsOfFollow(true);
        }
      },
      addLike(b) {
        axios.put("/blog/like/" + b.id)
          .then(({data}) => {
            this.queryBlogById(b);
          })
          .catch(err => {
            this.$message.error(err)
          })
      },
      queryBlogById(b) {
        axios.get("/blog/" + b.id)
          .then(({data}) => {
            b.liked = data.liked;
            b.isLike = data.isLike;
          })
          .catch(() => {
            this.$message.error('点赞状态更新失败，请重试');
          })
      },
      onScroll(e) {
        let scrollTop = e.target.scrollTop;
        let offsetHeight = e.target.offsetHeight;
        let scrollHeight = e.target.scrollHeight;
        if (scrollTop === 0) {
          // 到顶部了，查询一次
          this.queryBlogsOfFollow(true);
        } else if (scrollTop + offsetHeight >= scrollHeight - 48 && !this.isReachBottom) {
          this.isReachBottom = true
          // 再次查询下一页数据
          this.queryBlogsOfFollow();
        } else {
          this.isReachBottom = false
        }
      }
    },

  })
</script>
</body>

</html>
